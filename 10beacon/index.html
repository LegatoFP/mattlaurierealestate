<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <title>10 Beacon Place | Matt Laurie, REALTOR</title>
  <meta name="description" content="View the 10 Beacon Place listing photos and property tour, presented by Matt Laurie, REALTOR with Keller Williams Real Estate." />
  <meta property="og:title" content="10 Beacon Place | Matt Laurie, REALTOR" />
  <meta property="og:description" content="Property photos and listing tour presented by Matt Laurie, REALTOR with Keller Williams Real Estate." />
  <meta property="og:url" content="https://mattlaurierealestate.com/10beacon/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://mattlaurierealestate.com/matt-headshot-new.jpg" />
  <meta name="robots" content="noindex, follow" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: #f5f3ef;
      color: #1c1b19;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #e6e0d6;
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 7px;
      background: #b40101;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 760;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      color: #736b61;
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .phone, .open-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 760;
      text-decoration: none;
      white-space: nowrap;
    }
    .phone { background: #b40101; color: #fff; }
    .open-link { color: #1c1b19; border: 1px solid #d8d0c3; background: #fff; }
    .viewer {
      width: 100%;
      height: calc(100vh - 72px - 118px);
      min-height: 620px;
      background: #fff;
      border: 0;
      display: block;
    }
    .signature {
      background: #1c1b19;
      color: #fff;
      border-top: 4px solid #b40101;
    }
    .signature-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 118px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 20px 0;
    }
    .agent {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .agent img {
      width: 66px;
      height: 66px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      flex: 0 0 auto;
    }
    .agent-name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }
    .agent-role {
      color: #d6d0c7;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 5px;
    }
    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }
    .contact a {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      padding: 0 13px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 13px;
      font-weight: 760;
      text-decoration: none;
      white-space: nowrap;
    }
    .fallback {
      display: none;
      padding: 24px;
      text-align: center;
      background: #fff;
      border-top: 1px solid #e6e0d6;
    }
    .fallback a { color: #b40101; font-weight: 800; }
    @media (max-width: 720px) {
      .topbar-inner {
        min-height: 64px;
        width: min(100% - 24px, 1180px);
      }
      .brand-mark { width: 34px; height: 34px; }
      .brand-title { font-size: 14px; }
      .brand-sub { display: none; }
      .open-link { display: none; }
      .phone {
        min-height: 36px;
        padding: 0 11px;
        font-size: 12px;
      }
      .viewer {
        height: calc(100vh - 64px - 190px);
        min-height: 560px;
      }
      .signature-inner {
        width: min(100% - 24px, 1180px);
        min-height: 190px;
        align-items: flex-start;
        flex-direction: column;
        padding: 18px 0;
      }
      .agent img { width: 58px; height: 58px; }
      .agent-name { font-size: 18px; }
      .contact { justify-content: flex-start; }
      .contact a { min-height: 36px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">KW</div>
        <div>
          <div class="brand-title">10 Beacon Place</div>
          <div class="brand-sub">Presented by Matt Laurie, REALTOR</div>
        </div>
      </div>
      <div class="actions">
        <a class="open-link" href="https://listings.mikesperando.com/sites/rbvmbkan/unbranded" target="_blank" rel="noopener">Open tour</a>
        <a class="phone" href="tel:12672255611">Call Matt</a>
      </div>
    </div>
  </header>

  <iframe
    class="viewer"
    title="10 Beacon Place listing tour"
    src="https://listings.mikesperando.com/sites/rbvmbkan/unbranded"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; geolocation; picture-in-picture"
    allowfullscreen
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div class="fallback">
    <p>If the listing tour does not load, <a href="https://listings.mikesperando.com/sites/rbvmbkan/unbranded" target="_blank" rel="noopener">open it here</a>.</p>
  </div>

  <footer class="signature">
    <div class="signature-inner">
      <div class="agent">
        <img src="../matt-headshot-new.jpg" alt="Matt Laurie, REALTOR" />
        <div>
          <div class="agent-name">Matt Laurie, REALTOR</div>
          <div class="agent-role">
            Keller Williams Real Estate · The Kim Rock Group<br />
            PA License #RS333171 · NJ License #2671376
          </div>
        </div>
      </div>
      <div class="contact">
        <a href="tel:12672255611">(267) 225-5611</a>
        <a href="mailto:mattlaurie@kw.com">mattlaurie@kw.com</a>
        <a href="/">mattlaurierealestate.com</a>
      </div>
    </div>
  </footer>
</body>
</html>
